    <style>
      :root { --bg:#070a0f; --bg2:#0b1017; --panel:#121821; --panel2:#18202b; --line:#253041; --line2:#33415a; --txt:#e8eef5; --muted:#9aa8b8; --dim:#64748a; --acc:#4da6ff; --acc2:#9b8cff; --good:#5fd38d; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: radial-gradient(1400px 800px at 75% -10%, #0f1824 0%, var(--bg) 60%) fixed; color: var(--txt); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      .kicker { font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--acc); }

      h2 { font-size: 38px; font-weight: 800; margin: 6px 0 26px; }
      .lead { font-size: 18px; line-height: 1.6; color: var(--muted); max-width: 900px; }
      .hdr { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 12px 40px; background: rgba(7,10,15,0.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
      .brand { display: flex; gap: 12px; align-items: center; }
      .brand-k { font-size: 11px; color: var(--dim); font-weight: 600; letter-spacing: 1.6px; text-transform: uppercase; }
      .brand-p { font-size: 12px; color: var(--muted); display: flex; align-items: baseline; gap: 6px; }
      nav { display: flex; gap: 26px; align-items: center; font-size: 15px; color: var(--muted); }
      nav a:hover { color: #fff; }
      nav a.on { color: #fff; box-shadow: inset 0 -2px 0 var(--acc); padding-bottom: 4px; }
      nav a.nav-lab.on { box-shadow: 0 0 12px rgba(92,225,230,0.45); padding-bottom: 5px; }

      .ex-video { display: block; width: 100%; aspect-ratio: 16 / 9; margin-top: 16px; border-radius: 12px; border: 1px solid var(--line2); background: #05080c; }
      .lang { display: flex; border: 1px solid var(--line2); border-radius: 9px; overflow: hidden; }
      .lang button { background: none; border: 0; color: var(--dim); font: 700 13px Inter; padding: 6px 11px; cursor: pointer; }
      .lang button.on { background: var(--acc); color: #fff; }

      .hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .hero-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,10,15,0.92) 0%, rgba(7,10,15,0.55) 45%, rgba(7,10,15,0.1) 100%), linear-gradient(0deg, var(--bg) 0%, transparent 30%); }
      .hero-txt { position: absolute; left: 60px; bottom: 80px; max-width: 760px; }

      .row { display: flex; gap: 12px; flex-wrap: wrap; }

      .ucn { position: absolute; left: 10px; top: 10px; font: 700 13px "JetBrains Mono"; background: rgba(7,10,15,0.85); border: 1px solid var(--acc); border-radius: 8px; padding: 2px 8px; }
      .thumb .badge { position: absolute; right: 10px; top: 10px; }
      .dur { position: absolute; right: 10px; bottom: 10px; font: 600 12px "JetBrains Mono"; background: rgba(7,10,15,0.85); border-radius: 6px; padding: 2px 7px; color: var(--muted); }
      .tile h3 { font-size: 21px; margin: 14px 0 4px; }

      .badge { display: inline-block; font-size: 12px; font-weight: 700; border: 1px solid; border-radius: 8px; padding: 2px 8px; background: rgba(7,10,15,0.85); }

      .art-player video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #05080c; }
      .art-tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
      .art-tabs button { background: transparent; color: var(--muted); border: 1.5px solid var(--line2); border-radius: 999px; padding: 7px 14px; font: 600 14px Inter; cursor: pointer; }

      .art-cap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; font-size: 14px; }
      .art-cap .dim { color: var(--dim); font-size: 12.5px; }

      .used { font-size: 13px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; }
      .used a { color: var(--acc); }
      .about { display: flex; gap: 46px; align-items: center; }
      .field { display: grid; grid-template-columns: 1fr 1.6fr 1.6fr; gap: 18px; margin: 46px 0 40px; }
      .field figure, .uc-field { margin: 0; }
      .field img { width: 100%; height: 300px; object-fit: cover; border-radius: 14px; border: 1px solid var(--line2); background: #fff; }
      figcaption { font-size: 13px; color: var(--dim); margin-top: 8px; }
      .sub { color: var(--muted); margin: -8px 0 14px; font-size: 15px; }
      .links { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .lk { display: inline-flex; align-items: center; gap: 8px; border: 1px solid; border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; background: rgba(13,18,26,0.9); }
      .lk.big { padding: 11px 16px; font-size: 15px; }
      .lk .dot { width: 9px; height: 9px; border-radius: 9px; }
      .lk .ext { color: var(--dim); }
      .lk:hover { background: var(--panel2); }
      .caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 22px; }
      .cap { border: 1.5px solid; border-radius: 16px; padding: 22px; background: rgba(13,18,26,0.92); display: flex; flex-direction: column; gap: 10px; }
      .cap-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
      .cap h3 { font-size: 20px; line-height: 1.3; }
      .cap p { margin: 0; color: var(--muted); line-height: 1.55; font-size: 15.5px; }
      .cap ul { margin: 0; padding-left: 18px; color: var(--txt); font-size: 14.5px; line-height: 1.6; }
      .cap-img { display: grid; gap: 10px; margin-top: 4px; }
      .cap-img figure { margin: 0; }
      .cap-img img { width: 100%; height: 170px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line2); background: #fff; }
      .fusion { width: 100%; border-radius: 10px; border: 1px solid var(--line2); }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
      .tags span { font: 500 12px "JetBrains Mono"; color: var(--muted); border: 1px solid var(--line2); border-radius: 7px; padding: 2px 8px; }
      .prof h1 { font-size: 44px; font-weight: 800; margin: 6px 0; }
      .prof .about { margin: 10px 0 50px; align-items: flex-start; }
      .prof .lead { margin-bottom: 20px; }
      .prof section { margin-top: 60px; }
      .org { color: var(--acc2); font-size: 14px; margin-top: 2px; }
      .det { color: var(--muted); font-size: 14px; margin-top: 4px; line-height: 1.5; }
      .fund { color: var(--acc); font-weight: 600; }
      .yr { color: var(--dim); font-weight: 500; }
      .ln { color: var(--acc); font: 600 14.5px "JetBrains Mono"; }
      .skills { margin-bottom: 12px; }
      .skills small { display: block; color: var(--dim); font: 500 12px "JetBrains Mono"; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
      .pubs { display: flex; flex-direction: column; gap: 8px; }
      .pub { display: grid; grid-template-columns: 60px 1fr; gap: 14px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: rgba(13,18,26,0.9); }
      .pub:hover { border-color: var(--acc); }
      .pub .py { font: 700 15px "JetBrains Mono"; color: var(--acc); }
      .pub b { display: block; font-weight: 600; font-size: 15.5px; line-height: 1.4; }
      .pub small { color: var(--dim); font-size: 13px; }
      .vc { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 34px; align-items: center; }
      .vc-svg { width: 100%; max-width: 760px; overflow: visible; }
      .vc-flow { animation: vcflow 6s linear infinite; }
      @keyframes vcflow { to { stroke-dashoffset: -160; } }
      .vc-pulse { animation: vcflow 2.5s linear infinite reverse; }
      .vc-core1 { fill: #fff; font: 800 26px Inter; }
      .vc-core2 { fill: #9aa8b8; font: 500 14px Inter; }
      .vc-core3 { fill: #9b8cff; font: 700 13px "JetBrains Mono"; letter-spacing: 3px; }
      .vc-num { font: 800 16px "JetBrains Mono"; }
      .vc-lbl { fill: #9aa8b8; font: 600 17px Inter; }
      .vc-lbl.on { fill: #fff; font-weight: 800; }
      .vc-uc { fill: #e8eef5; font: 700 11px "JetBrains Mono"; }
      .vc-ucl { fill: #64748a; font: 600 13px "JetBrains Mono"; }
      .vc-macro { fill: #0b1017; font: 800 18px Inter; letter-spacing: 1px; dominant-baseline: middle; }
      .vc-node { cursor: pointer; }
      .vc-num2 { fill: #0b1017; font: 800 12px "JetBrains Mono"; }
      .vc-spin { animation: vcspin 60s linear infinite; } .vc-spin-r { animation: vcspin 90s linear infinite reverse; }
      @keyframes vcspin { to { transform: rotate(360deg); } }
      .vc-halo { animation: vchalo 1.8s ease-out infinite; }
      @keyframes vchalo { from { transform: scale(0.9); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
      .vc-pulse-ring { animation: vchalo 2.6s ease-out infinite; }
      .vc-show { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid var(--line2); margin-bottom: 16px; background: #fff; }
      .vc-show img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.08); transition: opacity 0.9s ease, transform 4s ease; }
      .vc-show img.on { opacity: 1; transform: scale(1.0); }
      .vc-show-dots { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 5px; }
      .vc-show-dots span { width: 18px; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.45); }
      .vc-panel { border: 1.5px solid; border-radius: 18px; padding: 24px; background: rgba(13,18,26,0.94); min-height: 360px; transition: border-color .4s; }
      .vc-panel h3 { font-size: 26px; margin: 6px 0 12px; }

      .vc-cap { font-size: 14px; color: var(--txt); }

      .vc-ucs { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
      .vc-ucs a { border: 1px solid; border-radius: 10px; padding: 9px 12px; font-size: 15px; background: var(--bg2); }
      .vc-ucs a b { font-family: "JetBrains Mono"; margin-right: 6px; }
      .vc-ucs a.ex { border-color: var(--line2); color: var(--muted); }
      .vc-dots { display: flex; gap: 6px; margin: 10px 0; }
      .vc-dots span { width: 22px; height: 6px; border-radius: 4px; cursor: pointer; transition: background .3s; }
      .vc-note { font-size: 12.5px !important; color: var(--dim) !important; margin-top: 12px; }
      .zoom { cursor: zoom-in; }
      .gallery figure.more { display: flex; flex-direction: column; }

      .lb-play.on { border-color: var(--acc); color: var(--acc); }
